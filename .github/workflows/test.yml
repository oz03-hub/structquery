name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          # every supported Python on the long-term-support runner
          - { os: ubuntu-24.04, python: "3.9" }
          - { os: ubuntu-24.04, python: "3.10" }
          - { os: ubuntu-24.04, python: "3.11" }
          - { os: ubuntu-24.04, python: "3.12" }
          - { os: ubuntu-24.04, python: "3.13" }
          - { os: ubuntu-24.04, python: "3.14" }
          # newest Ubuntu and compiler
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.14" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install (compiles the bundled Indri, a few minutes)
        run: python -m pip install -v ".[test]"
      - name: Test
        run: python -m pytest -q tests
      - name: Check documentation examples
        run: python scripts/check_docs.py
