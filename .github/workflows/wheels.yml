# Builds Linux binary wheels so users do not need a compiler. Runs only when started by hand or
# on a version tag; it does not publish anywhere. Download the wheels from the run's artifacts.
name: wheels
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_* *_i686"
          CIBW_BEFORE_ALL_LINUX: "yum install -y zlib-devel || true"
          CIBW_TEST_EXTRAS: test
          CIBW_TEST_COMMAND: "python -m pytest -q {project}/tests"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: wheelhouse/*.whl
